<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM-01 Cloud Instance & Console</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .dashboard {
      width: 100%;
      max-width: 1100px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .vm-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .vm-title p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* Main layout section split */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .main-layout {
        grid-template-columns: 350px 1fr;
      }
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .stat-card {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Console Workspace styling */
    .console-container {
      background-color: #000000;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 480px;
    }

    .console-header {
      background-color: #1e293b;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .console-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-r { background-color: #ef4444; }
    .dot-y { background-color: #eab308; }
    .dot-g { background-color: #22c55e; }

    .console-title {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
    }

    .console-body {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    iframe {
      border: none;
      background-color: #000;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <div class="vm-title">
        <h1>prod-web-vm-01</h1>
        <p>Ubuntu 24.04 LTS • cli.h2.nexus</p>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        Connected
      </div>
    </div>

    <div class="main-layout">
      <!-- Left Column: VM Statistics -->
      <div class="sidebar">
        <div class="stat-card">
          <div class="stat-label">Instance IP</div>
          <div class="stat-value" style="font-size: 1.1rem; color: var(--accent);">198.51.100.42</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">CPU Usage</div>
          <div class="stat-value">14.2%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Memory (RAM)</div>
          <div class="stat-value">2.4 / 8 GB</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Connection</div>
          <div class="stat-value" style="font-size: 1rem; font-weight: normal; color: var(--text-muted);">Web Terminal</div>
        </div>
      </div>

      <!-- Right Column: Interactive CLI Embed Space -->
      <div class="console-container">
        <div class="console-header">
          <span class="console-dot dot-r"></span>
          <span class="console-dot dot-y"></span>
          <span class="console-dot dot-g"></span>
          <span class="console-title">root@h2.nexus:~</span>
        </div>
        <div class="console-body">
          <iframe src="https://cli.h2.nexus" width="100%" height="100%"></iframe>
        </div>
      </div>
    </div>
    <iframe src="https://cli.h2.nexus" width="100%" height="100%"></iframe>
  </div>

</body>
</html>
